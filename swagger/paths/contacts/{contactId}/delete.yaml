tags:
  - Contacts
summary: Bir kişiyi sil
operationId: deleteContact
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
responses:
  '200':
    description: Silme başarılı.
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: 'contact deleted'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
