tags:
  - Contacts
summary: Tüm kişileri listele
operationId: getAllContacts
description: Kimliği doğrulanmış kullanıcının rehberindeki kişileri sayfalayarak getirir.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      default: 5
  - name: favorite
    in: query
    required: false
    schema:
      type: boolean
responses:
  '200':
    description: Başarılı listeleme.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
